name: Daily Trends Digest

on:
  schedule:
    - cron: "30 2 * * *"      # every day at 02:30 UTC = 08:00 IST
  workflow_dispatch:           # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python daily_digest_agent.py
      - name: Commit the new digest
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add digests/
          git commit -m "Add daily digest" || echo "Nothing to commit"
          git push
